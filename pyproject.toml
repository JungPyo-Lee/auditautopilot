[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auditautopilot"
version = "0.2.0"
description = "회계감사 중간·기말 업무 자동화 도구"
readme = "README.md"
requires-python = ">=3.10"
# 윈도우 앱 제어(스마트 앱 컨트롤 등)에 막히지 않도록 순수 파이썬 패키지만 쓴다.
# pandas, numpy, lxml 처럼 컴파일된 DLL이 들어 있는 패키지는 추가하지 않는다.
dependencies = [
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
auditautopilot = "auditautopilot.cli:main"

[tool.setuptools.packages.find]
include = ["auditautopilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
